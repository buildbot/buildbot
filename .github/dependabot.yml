version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/worker"
    # handled by the pip entry below
    exclude-paths:
      - "requirements*.txt"
    groups:
      uv-lock:
        group-by: dependency-name
    commit-message:
      prefix: "uv.lock: "
    open-pull-requests-limit: 15
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month

  # remaining hand maintained requirements*.txt
  - package-ecosystem: "pip"
    directory: "/"
    # handled by the uv entry above
    exclude-paths:
      - "pyproject.toml"
      - "uv.lock"
      # generated by common/export-requirements.sh
      - "requirements-ci.txt"
      - "requirements-cidocs.txt"
      - "requirements-cidb.txt"
      - "requirements-ci-pyinstaller.txt"
      - "requirements-ciworker.txt"
    commit-message:
      prefix: "requirements: "
    open-pull-requests-limit: 15
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month

  - package-ecosystem: "npm"
    directories:
      - "www/**"
    commit-message:
      prefix: "www: "
    # more PRs won't help due to merge conflicts in lock file
    open-pull-requests-limit: 3
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month

  - package-ecosystem: "npm"
    directories:
      - "e2e/**"
    commit-message:
      prefix: "e2e: "
    # more PRs won't help due to merge conflicts in lock file
    open-pull-requests-limit: 3
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month

  - package-ecosystem: "docker"
    directories:
      - "**/*"
    commit-message:
      prefix: "docker: "
    open-pull-requests-limit: 15
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      actions:
        group-by: dependency-name
    commit-message:
      prefix: "github: "
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"  # every 1st and 15th of the month
